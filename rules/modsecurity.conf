# ModSecurity v2/v3 (CRS-style). Detection only by default; make the actions
# "deny,status:503" if you prefer fail-closed over letting PHP parse the body.
#
# 1) Log every upload-progress POST that is big enough to reach the OOM path.
SecRule REQUEST_METHOD "@streq POST" \
  "id:2026109618,phase:2,pass,log,tag:'cve-2026-109618',tag:'php2shell',\
   chain"
  SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "chain"
    SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" "chain"
      SecRule REQUEST_HEADERS:Content-Length "@gt 6000000" \
        "msg:'php2shell upload-progress OOM attempt'"

# 2) Same, but an attacker-selected session id is being forced as well.
SecRule REQUEST_METHOD "@streq POST" \
  "id:2026109619,phase:2,pass,log,tag:'cve-2026-109618',tag:'php2shell',\
   chain"
  SecRule REQUEST_HEADERS:Cookie "@contains PHPSESSID=" "chain"
    SecRule REQUEST_HEADERS:Content-Length "@gt 6000000" \
      "msg:'php2shell session poison attempt'"

# 3) Belt and braces for unpatched hosts: cap the request at the proxy so the
#    PHP allocator can never be pushed past memory_limit by the body alone.
# SecRule REQUEST_HEADERS:Content-Length "@gt 8000000" \
#   "id:2026109620,phase:1,deny,status:413,msg:'request body over hardening cap'"
