# Deterministic worker reuse: one prefork child, so request N+1 always lands on
# the process that handled request N. Production has more children; the bug is
# the same, it just needs a retry.
<IfModule mpm_prefork_module>
    StartServers          @WORKERS@
    MinSpareServers       @WORKERS@
    MaxSpareServers       @WORKERS@
    MaxRequestWorkers     @WORKERS@
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive On
KeepAliveTimeout 30

# Keep the interesting stuff visible in `container logs`.
LogLevel info
