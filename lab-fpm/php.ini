; Lab config -- PHP production defaults, nothing exotic.
; Every value here matches what php.ini-production ships, except session
; upload progress cleanup which we disable so the poisoned session record
; stays readable for the writeup.
engine = On
expose_php = On

memory_limit = @MEMORY_LIMIT@
post_max_size = @POST_MAX_SIZE@
file_uploads = On
upload_max_filesize = @UPLOAD_MAX_FILESIZE@
max_file_uploads = 20
max_input_vars = @MAX_INPUT_VARS@
max_input_nesting_level = @MAX_INPUT_NESTING_LEVEL@

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = @DISPLAY_ERRORS@
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off
fatal_error_backtraces = Off

session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.serialize_handler = php
session.upload_progress.enabled = @SESSION_UPLOAD_PROGRESS@
session.upload_progress.cleanup = 0
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 0
session.upload_progress.min_freq = 0

date.timezone = UTC
